openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: report
    description: AI-generated IPO intelligence reports
  - name: ipo
    description: IPO event data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /report/generate:
    post:
      operationId: generateReport
      tags: [report]
      summary: Generate a Global IPO Intelligence Report using Gemini AI
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportGenerateInput"
      responses:
        "200":
          description: Generated report content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOutput"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
  /ipo/live:
    get:
      operationId: getLiveIpoEvents
      tags: [ipo]
      summary: Fetch live IPO events via Gemini Google Search grounding
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
          description: Optional region filter (e.g. NORTH_AMERICA, EUROPE)
      responses:
        "200":
          description: Live IPO events with metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveIPOEventsResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReportGenerateInput:
      type: object
      properties:
        region:
          type: string
          description: Optional region filter (e.g. "North America", "South Asia")
        focus:
          type: string
          description: Optional focus area or keywords
    ReportOutput:
      type: object
      properties:
        content:
          type: string
        generatedAt:
          type: string
          format: date-time
        region:
          type: string
      required:
        - content
        - generatedAt
        - region
    ReportError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LiveIPOEvent:
      type: object
      properties:
        id:
          type: string
        company:
          type: string
        ticker:
          type: string
        exchange:
          type: string
        region:
          type: string
          description: "One of: NORTH_AMERICA, EUROPE, EAST_ASIA, SOUTH_ASIA, MIDDLE_EAST, OCEANIA"
        sector:
          type: string
        eventType:
          type: string
          description: "One of: S1_FILED, PRICING, DAY1_LISTING, BOOK_BUILDING, SPAC, DIRECT_LISTING, UPLISTING, ALLOTMENT, WITHDRAWAL, RUMOR"
        raiseAmountUSD:
          type: string
        raiseAmountLocal:
          type: string
        offerPrice:
          type: string
        priceBand:
          type: string
        postMoneyValuation:
          type: string
        subscriptionQIB:
          type: number
        subscriptionNII:
          type: number
        subscriptionRetail:
          type: number
        subscriptionOverall:
          type: number
        gmp:
          type: string
        day1Performance:
          type: number
        lotSize:
          type: number
        leadBookrunners:
          type: array
          items:
            type: string
        listingDate:
          type: string
        filingDate:
          type: string
        summary:
          type: string
        source:
          type: string
      required:
        - id
        - company
        - exchange
        - region
        - sector
        - eventType
        - summary
        - source
    LiveIPOEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/LiveIPOEvent"
        fetchedAt:
          type: string
          format: date-time
        cached:
          type: boolean
        totalCount:
          type: integer
      required:
        - events
        - fetchedAt
        - cached
        - totalCount
