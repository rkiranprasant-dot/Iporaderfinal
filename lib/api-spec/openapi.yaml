openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: report
    description: AI-generated IPO intelligence reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /report/generate:
    post:
      operationId: generateReport
      tags: [report]
      summary: Generate a Global IPO Intelligence Report using Gemini AI
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportGenerateInput"
      responses:
        "200":
          description: Generated report content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportOutput"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReportGenerateInput:
      type: object
      properties:
        region:
          type: string
          description: Optional region filter (e.g. "North America", "South Asia")
        focus:
          type: string
          description: Optional focus area or keywords
    ReportOutput:
      type: object
      properties:
        content:
          type: string
        generatedAt:
          type: string
          format: date-time
        region:
          type: string
      required:
        - content
        - generatedAt
        - region
    ReportError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
